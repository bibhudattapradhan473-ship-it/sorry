<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 420" width="100%" height="100%">
  <defs>
    <!-- Glass Gradients -->
    <linearGradient id="glassBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="15%" stop-color="#E0F2FE" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#F8FAFC" stop-opacity="0.05"/>
      <stop offset="85%" stop-color="#E0F2FE" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="glassRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#BAE6FD" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="corkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7A97B"/>
      <stop offset="50%" stop-color="#B88655"/>
      <stop offset="100%" stop-color="#8F5E33"/>
    </linearGradient>
    <linearGradient id="ribbonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FDE047" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heartGlowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6584" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#FF2E63" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF2E63" stop-opacity="0"/>
    </radialGradient>
    <filter id="jarShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#49333B" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="170" cy="400" rx="120" ry="16" fill="#49333B" opacity="0.12"/>

  <!-- Jar Outer Contour with Filter -->
  <g filter="url(#jarShadow)">
    <!-- Cork Lid -->
    <path d="M 120 45 L 220 45 L 210 75 L 130 75 Z" fill="url(#corkGradient)"/>
    <ellipse cx="170" cy="45" rx="50" ry="10" fill="#E8C39E"/>
    <!-- Cork Texture lines -->
    <path d="M 140 55 Q 170 58 200 55 M 145 65 Q 170 68 195 65" stroke="#784C25" stroke-width="1" opacity="0.4" fill="none"/>

    <!-- Jar Rim / Neck -->
    <path d="M 115 75 L 225 75 C 225 90, 235 95, 245 110 L 255 350 C 255 385, 230 395, 170 395 C 110 395, 85 385, 85 350 L 95 110 C 105 95, 115 90, 115 75 Z" 
          fill="url(#glassBody)" stroke="url(#glassRim)" stroke-width="3"/>

    <!-- Glass Rim Lip -->
    <ellipse cx="170" cy="75" rx="55" ry="10" fill="none" stroke="url(#glassRim)" stroke-width="3.5"/>
  </g>

  <!-- Glowing Fireflies / Magic Dust inside Jar -->
  <circle cx="130" cy="190" r="14" fill="url(#starGlow)"/>
  <circle cx="130" cy="190" r="3" fill="#FFF"/>

  <circle cx="215" cy="230" r="16" fill="url(#starGlow)"/>
  <circle cx="215" cy="230" r="3.5" fill="#FFF"/>

  <circle cx="170" cy="310" r="18" fill="url(#starGlow)"/>
  <circle cx="170" cy="310" r="4" fill="#FFF"/>

  <circle cx="140" cy="260" r="10" fill="url(#starGlow)"/>
  <circle cx="200" cy="160" r="12" fill="url(#starGlow)"/>

  <!-- Glowing Floating Mini Hearts Inside Jar -->
  <g transform="translate(145, 175) scale(0.65)">
    <path d="M 0 10 C -15 -5, -20 -20, -10 -25 C -5 -28, 0 -22, 0 -18 C 0 -22, 5 -28, 10 -25 C 20 -20, 15 -5, 0 10 Z" fill="#FF477E"/>
  </g>
  <g transform="translate(195, 210) scale(0.55)">
    <path d="M 0 10 C -15 -5, -20 -20, -10 -25 C -5 -28, 0 -22, 0 -18 C 0 -22, 5 -28, 10 -25 C 20 -20, 15 -5, 0 10 Z" fill="#F43F5E"/>
  </g>
  <g transform="translate(160, 275) scale(0.7)">
    <path d="M 0 10 C -15 -5, -20 -20, -10 -25 C -5 -28, 0 -22, 0 -18 C 0 -22, 5 -28, 10 -25 C 20 -20, 15 -5, 0 10 Z" fill="#EC4899"/>
  </g>

  <!-- Jar Tag & Ribbon -->
  <!-- Tied String around neck -->
  <ellipse cx="170" cy="88" rx="56" ry="6" fill="none" stroke="#DB2777" stroke-width="4"/>
  <!-- Bow -->
  <path d="M 170 90 C 150 78, 135 90, 150 96 C 165 102, 170 90, 170 90 Z" fill="url(#ribbonPink)"/>
  <path d="M 170 90 C 190 78, 205 90, 190 96 C 175 102, 170 90, 170 90 Z" fill="url(#ribbonPink)"/>
  <circle cx="170" cy="91" r="5" fill="#9D174D"/>
  <!-- Hanging Ribbon Ends -->
  <path d="M 168 93 Q 155 125 145 138 Q 150 142 154 133 Q 163 118 170 96" fill="#F472B6"/>
  <path d="M 172 93 Q 185 125 195 138 Q 190 142 186 133 Q 177 118 170 96" fill="#DB2777"/>

  <!-- Vintage Label on Jar Front -->
  <g transform="translate(170, 240)">
    <!-- Label Background -->
    <rect x="-65" y="-35" width="130" height="70" rx="8" fill="#FFFDF8" stroke="#E2D4C5" stroke-width="1.5"/>
    <rect x="-60" y="-30" width="120" height="60" rx="5" fill="none" stroke="#F1E4D6" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="0" y="-8" text-anchor="middle" fill="#8E365A" font-family="'Playfair Display', serif" font-size="14" font-weight="bold" letter-spacing="1">
      LITTLE LETTERS
    </text>
    <text x="0" y="8" text-anchor="middle" fill="#713F12" font-family="'Caveat', cursive" font-size="16">
      for my sweetest Itu
    </text>
    <text x="0" y="22" text-anchor="middle" fill="#E11D48" font-size="11">
      ♥ 5 SPECIAL LETTERS ♥
    </text>
  </g>

  <!-- Glass Highlights (left and right curved reflection) -->
  <path d="M 105 130 Q 95 240 102 340" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 112 150 Q 104 235 110 320" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M 238 140 Q 248 240 240 330" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>
</svg>
