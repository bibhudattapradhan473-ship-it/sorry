<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="waxBase" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="50%" stop-color="#9F1239"/>
      <stop offset="90%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </radialGradient>
    <radialGradient id="waxInner" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#BE123C"/>
      <stop offset="70%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </radialGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0"/>
    </linearGradient>
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#49333B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#sealShadow)">
    <!-- Organic Irregular Wax Edge -->
    <path d="M 80 15 
             C 105 12, 125 22, 138 42 
             C 148 58, 147 78, 142 98 
             C 137 118, 122 135, 102 143 
             C 82 150, 62 147, 45 138 
             C 25 128, 15 110, 14 88 
             C 13 68, 22 45, 40 30 
             C 55 18, 68 16, 80 15 Z" 
          fill="url(#waxBase)"/>

    <!-- Inner Rim with stamp depression -->
    <circle cx="80" cy="80" r="48" fill="url(#waxInner)" stroke="#FDA4AF" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="80" cy="80" r="45" fill="none" stroke="#4C0519" stroke-width="2" stroke-opacity="0.7"/>

    <!-- Embossed Heart in center -->
    <g transform="translate(80, 83) scale(0.85)">
      <!-- Heart Shadow (inset stamp feel) -->
      <path d="M 0 25 
               C -35 -10, -50 -45, -25 -58 
               C -10 -65, 0 -50, 0 -42 
               C 0 -50, 10 -65, 25 -58 
               C 50 -45, 35 -10, 0 25 Z" 
            fill="#4C0519" opacity="0.6" transform="translate(1, 2)"/>
      <!-- Heart Emboss -->
      <path d="M 0 25 
               C -35 -10, -50 -45, -25 -58 
               C -10 -65, 0 -50, 0 -42 
               C 0 -50, 10 -65, 25 -58 
               C 50 -45, 35 -10, 0 25 Z" 
            fill="#E11D48" stroke="#FDA4AF" stroke-width="2"/>
      <!-- Initial Letters B + I (Bubu + Itu) -->
      <text x="0" y="-12" text-anchor="middle" fill="#FFE4E6" font-family="'Playfair Display', serif" font-size="16" font-weight="bold" letter-spacing="2">
        B + I
      </text>
    </g>

    <!-- Wax Highlight Shine -->
    <path d="M 45 40 C 60 25, 100 25, 115 42" stroke="url(#goldShine)" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
</svg>
