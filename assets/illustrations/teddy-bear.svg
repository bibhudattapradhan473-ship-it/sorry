<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="teddyFur" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E4B491"/>
      <stop offset="60%" stop-color="#C58A63"/>
      <stop offset="100%" stop-color="#9E623E"/>
    </radialGradient>
    <radialGradient id="teddyInnerEar" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FCD5CE"/>
      <stop offset="100%" stop-color="#EFA7C0"/>
    </radialGradient>
    <radialGradient id="teddySnout" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF0E5"/>
      <stop offset="100%" stop-color="#F3D1BC"/>
    </radialGradient>
    <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6584"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#8E365A"/>
    </linearGradient>
    <linearGradient id="heartShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="bearShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#49333B" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#bearShadow)">
    <!-- Left Ear -->
    <circle cx="85" cy="85" r="38" fill="url(#teddyFur)"/>
    <circle cx="88" cy="88" r="22" fill="url(#teddyInnerEar)"/>

    <!-- Right Ear -->
    <circle cx="235" cy="85" r="38" fill="url(#teddyFur)"/>
    <circle cx="232" cy="88" r="22" fill="url(#teddyInnerEar)"/>

    <!-- Left Foot -->
    <ellipse cx="95" cy="285" rx="36" ry="24" fill="url(#teddyFur)"/>
    <ellipse cx="95" cy="283" rx="22" ry="14" fill="url(#teddyInnerEar)"/>

    <!-- Right Foot -->
    <ellipse cx="225" cy="285" rx="36" ry="24" fill="url(#teddyFur)"/>
    <ellipse cx="225" cy="283" rx="22" ry="14" fill="url(#teddyInnerEar)"/>

    <!-- Teddy Body -->
    <ellipse cx="160" cy="215" rx="76" ry="82" fill="url(#teddyFur)"/>
    <ellipse cx="160" cy="225" rx="50" ry="54" fill="url(#teddySnout)" opacity="0.6"/>

    <!-- Teddy Head -->
    <ellipse cx="160" cy="140" rx="78" ry="70" fill="url(#teddyFur)"/>

    <!-- Teddy Snout Area -->
    <ellipse cx="160" cy="158" rx="36" ry="26" fill="url(#teddySnout)"/>

    <!-- Nose -->
    <path d="M 152 148 C 152 144, 168 144, 168 148 C 168 155, 160 160, 160 160 C 160 160, 152 155, 152 148 Z" fill="#4A2E18"/>

    <!-- Cute Mouth (gentle apologetic smile) -->
    <path d="M 160 160 L 160 167" stroke="#4A2E18" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 150 168 Q 160 174 170 168" stroke="#4A2E18" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Big Cute Eyes with Reflections -->
    <!-- Left Eye -->
    <ellipse cx="126" cy="132" rx="9" ry="12" fill="#2E1C12"/>
    <circle cx="123" cy="128" r="3.5" fill="#FFFFFF"/>
    <circle cx="128" cy="136" r="1.5" fill="#FFFFFF"/>

    <!-- Right Eye -->
    <ellipse cx="194" cy="132" rx="9" ry="12" fill="#2E1C12"/>
    <circle cx="191" cy="128" r="3.5" fill="#FFFFFF"/>
    <circle cx="196" cy="136" r="1.5" fill="#FFFFFF"/>

    <!-- Blushing Pink Cheeks -->
    <ellipse cx="106" cy="152" rx="14" ry="9" fill="#FF8BA7" opacity="0.6" filter="url(#softGlow)"/>
    <ellipse cx="214" cy="152" rx="14" ry="9" fill="#FF8BA7" opacity="0.6" filter="url(#softGlow)"/>

    <!-- Eyebrows (gentle, slightly tilted puppy-eyes) -->
    <path d="M 118 116 Q 128 112 136 118" stroke="#7A4B29" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 202 116 Q 192 112 184 118" stroke="#7A4B29" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Cute Band-Aid on Forehead (symbolizing care and gentle vulnerability) -->
    <g transform="rotate(-15 130 95)">
      <rect x="115" y="90" width="30" height="12" rx="4" fill="#FFD1B3" stroke="#E6A885" stroke-width="1.5"/>
      <circle cx="130" cy="96" r="1.5" fill="#E6A885"/>
      <circle cx="124" cy="96" r="1.5" fill="#E6A885"/>
      <circle cx="136" cy="96" r="1.5" fill="#E6A885"/>
    </g>

    <!-- BIG GLOWING HEART HELD IN PAWS -->
    <g class="teddy-heart-group" transform="translate(160, 222)">
      <!-- Outer Heart Glow -->
      <path d="M 0 35 
               C -55 -15, -75 -65, -35 -85 
               C -15 -95, 0 -75, 0 -65 
               C 0 -75, 15 -95, 35 -85 
               C 75 -65, 55 -15, 0 35 Z" 
            fill="#FF85A1" opacity="0.3" filter="url(#softGlow)" transform="scale(1.15) translate(0, 10)"/>

      <!-- Main Heart -->
      <path d="M 0 32 
               C -50 -10, -68 -55, -32 -72 
               C -12 -80, 0 -62, 0 -54 
               C 0 -62, 12 -80, 32 -72 
               C 68 -55, 50 -10, 0 32 Z" 
            fill="url(#heartGradient)"/>

      <!-- Heart Shine Accent -->
      <path d="M -22 -62 
               C -35 -50, -42 -25, -28 -12 
               C -30 -22, -26 -44, -12 -54 
               C -16 -58, -19 -60, -22 -62 Z" 
            fill="url(#heartShine)"/>

      <!-- "I'M SORRY" / "FOR ITU" Script on Heart -->
      <text x="0" y="-28" text-anchor="middle" fill="#FFF0F5" font-family="'Caveat', cursive, serif" font-size="16" font-weight="bold" letter-spacing="1">
        For My Itu
      </text>
      <text x="0" y="-12" text-anchor="middle" fill="#FFE4E6" font-family="'Caveat', cursive, serif" font-size="13" font-style="italic">
        I Love You ❤️
      </text>
    </g>

    <!-- Left Paw Hugging Heart -->
    <ellipse cx="108" cy="202" rx="20" ry="16" fill="url(#teddyFur)" transform="rotate(30 108 202)"/>
    <ellipse cx="106" cy="200" rx="10" ry="7" fill="url(#teddyInnerEar)" transform="rotate(30 108 202)"/>

    <!-- Right Paw Hugging Heart -->
    <ellipse cx="212" cy="202" rx="20" ry="16" fill="url(#teddyFur)" transform="rotate(-30 212 202)"/>
    <ellipse cx="214" cy="200" rx="10" ry="7" fill="url(#teddyInnerEar)" transform="rotate(-30 212 202)"/>
  </g>
</svg>
