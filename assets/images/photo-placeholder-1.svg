<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE2E4"/>
      <stop offset="50%" stop-color="#FFCAD4"/>
      <stop offset="100%" stop-color="#B5E2FA"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFF9EC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FCD5CE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg1)"/>
  <circle cx="300" cy="180" r="160" fill="url(#sunGlow)"/>

  <!-- Fairy lights string -->
  <path d="M 0 60 Q 150 120 300 70 Q 450 130 600 65" fill="none" stroke="#51444A" stroke-width="1.5" opacity="0.4"/>
  <!-- Glowing bulbs -->
  <circle cx="80" cy="88" r="7" fill="#FEF08A"/>
  <circle cx="160" cy="98" r="8" fill="#FDE047"/>
  <circle cx="240" cy="78" r="7" fill="#FEF08A"/>
  <circle cx="330" cy="85" r="8" fill="#FDE047"/>
  <circle cx="420" cy="105" r="7" fill="#FEF08A"/>
  <circle cx="510" cy="82" r="8" fill="#FDE047"/>

  <!-- Romantic Couple Silhouette smiling/laughing -->
  <g transform="translate(180, 160)" opacity="0.85">
    <!-- Guy -->
    <circle cx="90" cy="70" r="38" fill="#49333B"/>
    <path d="M 50 180 C 50 130 70 115 90 115 C 110 115 130 130 130 180 Z" fill="#49333B"/>
    <!-- Girl smiling (leaning in) -->
    <circle cx="150" cy="80" r="34" fill="#6B4B57"/>
    <!-- Ponytail / Hair flow -->
    <path d="M 170 85 C 195 100 200 135 185 160 C 180 140 175 110 165 95 Z" fill="#6B4B57"/>
    <path d="M 120 180 C 120 135 135 120 155 120 C 175 120 190 135 190 180 Z" fill="#6B4B57"/>
    <!-- Tiny heart floating between them -->
    <path d="M 120 70 C 112 58 98 62 108 76 L 120 88 L 132 76 C 142 62 128 58 120 70 Z" fill="#FF4D6D"/>
  </g>

  <!-- Ground hills & sparkles -->
  <path d="M 0 380 Q 200 350 400 370 Q 520 380 600 360 L 600 450 L 0 450 Z" fill="#E8B4B8" opacity="0.6"/>
  <path d="M 0 400 Q 300 380 600 405 L 600 450 L 0 450 Z" fill="#D8929A" opacity="0.5"/>

  <!-- Badge banner -->
  <rect x="180" y="380" width="240" height="38" rx="19" fill="#FFFFFF" opacity="0.9"/>
  <text x="300" y="405" text-anchor="middle" fill="#8E365A" font-family="'Caveat', cursive" font-size="22" font-weight="bold">
    Your Smile Lights Up My Life ✨
  </text>
</svg>
