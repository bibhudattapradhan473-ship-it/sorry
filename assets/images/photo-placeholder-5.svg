<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="30%" stop-color="#9333EA"/>
      <stop offset="55%" stop-color="#F43F5E"/>
      <stop offset="75%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <radialGradient id="sunDisc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="40%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="450" fill="url(#sunsetSky)"/>

  <!-- Golden Sun setting on horizon -->
  <circle cx="300" cy="270" r="100" fill="url(#sunDisc)"/>
  <circle cx="300" cy="270" r="48" fill="#FFFBEB"/>

  <!-- Clouds reflecting pink & orange -->
  <path d="M 50 180 Q 110 160 170 180 Q 210 170 250 190 Q 150 200 50 180 Z" fill="#FDA4AF" opacity="0.4"/>
  <path d="M 380 150 Q 450 135 520 150 Q 560 140 590 160 Q 480 170 380 150 Z" fill="#F472B6" opacity="0.4"/>

  <!-- Distant Hill range -->
  <path d="M 0 320 Q 150 280 300 310 Q 450 270 600 320 L 600 450 L 0 450 Z" fill="#581C87" opacity="0.6"/>

  <!-- Foreground Hill with Couple Silhouette -->
  <path d="M 0 370 Q 250 320 600 365 L 600 450 L 0 450 Z" fill="#2E1065"/>

  <!-- Couple silhouette sitting together on hill looking at sunset -->
  <g transform="translate(245, 275)">
    <!-- Boy -->
    <circle cx="35" cy="25" r="18" fill="#1E0B38"/>
    <path d="M 15 80 C 15 50 25 45 35 45 C 45 45 55 50 55 80 Z" fill="#1E0B38"/>
    <!-- Girl leaning head on boy's shoulder -->
    <circle cx="65" cy="32" r="16" fill="#1E0B38"/>
    <!-- Long hair silhouette -->
    <path d="M 75 35 C 85 45 88 65 80 80 C 75 70 75 55 70 45 Z" fill="#1E0B38"/>
    <path d="M 50 80 C 50 55 60 50 70 50 C 80 50 88 55 88 80 Z" fill="#1E0B38"/>
    <!-- Boy arm around girl -->
    <path d="M 30 55 C 50 50 70 55 80 62" stroke="#1E0B38" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Flying birds silhouette -->
  <path d="M 140 120 Q 148 114 156 120 Q 164 114 172 120" stroke="#FFF" stroke-width="1.8" fill="none" opacity="0.7"/>
  <path d="M 165 105 Q 171 100 177 105 Q 183 100 189 105" stroke="#FFF" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Banner -->
  <rect x="175" y="390" width="250" height="36" rx="18" fill="#FFFFFF" opacity="0.95"/>
  <text x="300" y="415" text-anchor="middle" fill="#8E365A" font-family="'Caveat', cursive" font-size="22" font-weight="bold">
    Sunset Whispers &amp; Golden Hours 🌅
  </text>
</svg>
