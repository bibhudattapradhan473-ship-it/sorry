<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cosmicBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="40%" stop-color="#1E1B4B"/>
      <stop offset="80%" stop-color="#3B0764"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>
    <radialGradient id="nebulaPink" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="450" fill="url(#cosmicBg)"/>
  <circle cx="300" cy="180" r="220" fill="url(#nebulaPink)"/>

  <!-- Field of Stars -->
  <g fill="#FFF">
    <circle cx="50" cy="60" r="1.5"/>
    <circle cx="120" cy="140" r="1"/>
    <circle cx="180" cy="50" r="2"/>
    <circle cx="230" cy="110" r="1.5"/>
    <circle cx="420" cy="60" r="1.5"/>
    <circle cx="490" cy="130" r="2"/>
    <circle cx="540" cy="80" r="1"/>
    <circle cx="90" cy="220" r="1"/>
    <circle cx="520" cy="240" r="1.5"/>
  </g>

  <!-- Crescent Moon -->
  <circle cx="480" cy="90" r="32" fill="#FDE68A"/>
  <circle cx="470" cy="84" r="28" fill="#1E1B4B"/>

  <!-- Heart Constellation in the Center of the sky -->
  <g stroke="#F472B6" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8">
    <line x1="300" y1="210" x2="250" y2="160"/>
    <line x1="250" y1="160" x2="230" y2="120"/>
    <line x1="230" y1="120" x2="260" y2="90"/>
    <line x1="260" y1="90" x2="300" y2="125"/>
    <line x1="300" y1="125" x2="340" y2="90"/>
    <line x1="340" y1="90" x2="370" y2="120"/>
    <line x1="370" y1="120" x2="350" y2="160"/>
    <line x1="350" y1="160" x2="300" y2="210"/>
  </g>
  <!-- Constellation Star Nodes -->
  <g fill="#FFF">
    <circle cx="300" cy="210" r="4"/>
    <circle cx="250" cy="160" r="3.5"/>
    <circle cx="230" cy="120" r="4"/>
    <circle cx="260" cy="90" r="3.5"/>
    <circle cx="300" cy="125" r="4.5"/>
    <circle cx="340" cy="90" r="3.5"/>
    <circle cx="370" cy="120" r="4"/>
    <circle cx="350" cy="160" r="3.5"/>
  </g>
  <text x="300" y="165" text-anchor="middle" fill="#FCE7F3" font-family="'Caveat', cursive" font-size="20">
    Bubu &amp; Itu
  </text>

  <!-- Mountain Silhouettes -->
  <polygon points="0,380 140,290 280,380" fill="#1E132B" opacity="0.7"/>
  <polygon points="200,380 360,270 520,380" fill="#140924" opacity="0.8"/>
  <polygon points="380,380 490,300 600,380" fill="#1E132B" opacity="0.7"/>

  <!-- Winding Path below -->
  <path d="M 0 410 Q 300 370 600 410 L 600 450 L 0 450 Z" fill="#0A0414"/>
  <path d="M 280 450 Q 300 410 320 380 Q 330 380 310 450 Z" fill="#F472B6" opacity="0.2"/>

  <!-- Banner -->
  <rect x="175" y="390" width="250" height="36" rx="18" fill="#FFFFFF" opacity="0.95"/>
  <text x="300" y="415" text-anchor="middle" fill="#8E365A" font-family="'Caveat', cursive" font-size="22" font-weight="bold">
    Our Next Beautiful Chapters 🌌
  </text>
</svg>
