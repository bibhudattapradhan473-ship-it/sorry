<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="blushPastel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="50%" stop-color="#FDE2E4"/>
      <stop offset="100%" stop-color="#FFCAD4"/>
    </linearGradient>
    <radialGradient id="heartCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF758F" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF758F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="450" fill="url(#blushPastel)"/>
  <circle cx="300" cy="220" r="180" fill="url(#heartCenterGlow)"/>

  <!-- Drifting rose petals -->
  <g fill="#FF85A1" opacity="0.65">
    <ellipse cx="120" cy="90" rx="14" ry="8" transform="rotate(35 120 90)"/>
    <ellipse cx="180" cy="140" rx="12" ry="7" transform="rotate(-20 180 140)"/>
    <ellipse cx="460" cy="110" rx="15" ry="9" transform="rotate(45 460 110)"/>
    <ellipse cx="510" cy="190" rx="13" ry="8" transform="rotate(-15 510 190)"/>
    <ellipse cx="100" cy="310" rx="14" ry="8" transform="rotate(60 100 310)"/>
    <ellipse cx="480" cy="330" rx="12" ry="7" transform="rotate(-40 480 330)"/>
  </g>

  <!-- Stylized Holding Hands -->
  <g transform="translate(130, 140)">
    <!-- Sleeve Left (Boyfriend - navy/charcoal) -->
    <path d="M 0 60 L 90 75 L 85 130 L 0 110 Z" fill="#49333B"/>
    <!-- Sleeve Right (Girlfriend - soft rose) -->
    <path d="M 340 60 L 250 75 L 255 130 L 340 110 Z" fill="#EFA7C0"/>

    <!-- Left Hand (larger, holding) -->
    <path d="M 85 85 C 120 90, 160 95, 175 110 C 185 120, 175 135, 150 135 C 130 135, 100 125, 85 120 Z" fill="#E8B498"/>
    <!-- Left Hand Fingers wrapped -->
    <path d="M 160 105 C 185 110, 200 125, 185 145 C 170 155, 150 150, 135 140 Z" fill="#DF9F82"/>

    <!-- Right Hand (smaller, resting inside) -->
    <path d="M 255 85 C 220 90, 175 95, 160 110 C 150 120, 160 135, 185 135 C 205 135, 235 125, 255 120 Z" fill="#FCE0D2"/>
    <!-- Right Hand Fingers delicate -->
    <path d="M 175 112 C 160 120, 155 132, 170 140 C 182 145, 195 138, 205 130 Z" fill="#F3C3AD"/>

    <!-- Red string / heart tied around pinky finger -->
    <path d="M 170 140 Q 170 190 190 200 Q 210 190 210 140" fill="none" stroke="#E11D48" stroke-width="2.5" stroke-dasharray="4,2"/>
    <!-- Heart charm -->
    <path d="M 190 200 C 184 192, 176 195, 180 203 L 190 212 L 200 203 C 204 195, 196 192, 190 200 Z" fill="#E11D48"/>
  </g>

  <!-- Banner -->
  <rect x="180" y="380" width="240" height="38" rx="19" fill="#FFFFFF" opacity="0.95"/>
  <text x="300" y="405" text-anchor="middle" fill="#8E365A" font-family="'Caveat', cursive" font-size="22" font-weight="bold">
    Holding Your Hand Forever ♥
  </text>
</svg>
